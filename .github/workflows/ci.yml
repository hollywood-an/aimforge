name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run check

      - name: Start static server
        run: npx http-server -p 8317 -c-1 . &

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8317/ >/dev/null && exit 0
            sleep 1
          done
          echo "server never came up"; exit 1

      # Uses the runner's preinstalled Chrome. If GitHub's images ever drop it,
      # swap in browser-actions/setup-chrome and point CHROME_PATH at its output.
      - name: E2E tests (headless Chrome + SwiftShader WebGL)
        run: npm test
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: tests/out
          if-no-files-found: ignore
